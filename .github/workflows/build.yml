name: Android APK Build

# Ye workflow tab chalega jab main branch par code push hoga ya PR aayega
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Repository se code checkout karne ke liye
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Java (JDK 17) setup karne ke liye
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. Gradle wrapper ko execute karne ki permission dene ke liye
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    # 4. Debug APK build karne ki command
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 5. Build hui APK ko GitHub artifacts me upload karne ke liye
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
