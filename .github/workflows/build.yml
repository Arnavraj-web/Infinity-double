name: Generate Android APK and AAB from HTML

on:
  push:
    branches:
      - main # Agar branch ka naam master hai toh 'master' likhein

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Verify Web Assets Folder
        run: |
          ls -la www

      - name: Install and Initialize Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli
          npm install @capacitor/android
          npx cap init "My HTML App" "com.example.htmlapp" --web-dir=www
          npx cap add android

      - name: Sync Web assets to Android Project
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build Production AAB
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android/app/build/outputs/bundle/release/app-release-unsigned.aab
